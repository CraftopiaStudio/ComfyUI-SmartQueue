# Kept in tests/ rather than in ../pyproject.toml on purpose: it makes tests/
# the rootdir, so the repo root stays out of pytest's collection tree. The root
# is a package (ComfyUI requires __init__.py there) whose directory name has
# hyphens, so pytest can only import it as a top-level module named "__init__",
# which its `from .backend...` imports cannot survive.
[pytest]
asyncio_mode = auto
addopts = --import-mode=importlib
